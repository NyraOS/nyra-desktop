# SPDX-License-Identifier: GPL-3.0-or-later
# nyra-updated for the desktop image (docs/IMAGE.md, "Identity"): this file replaces the base's, so a
# desktop machine follows the desktop's channel sheets and never the base's. The Containerfile sets the
# repository to the one this image is released to (nyra-desktop-arm64 on arm64).
repository = nyra-desktop
channel = stable
# No target older than this, not even a signed retraction. The desktop counts in its own build numbers,
# not the base's: raise it when the base raises its floor for a rotated sheet key (docs/IMAGE.md, "Identity").
version_floor = 2026.10.1
