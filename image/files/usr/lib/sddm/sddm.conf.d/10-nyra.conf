# nyra-desktop: SDDM's settings (docs/IMAGE.md, "Login screen"). SDDM reads /usr/lib/sddm/sddm.conf.d
# first, then /etc/sddm.conf.d and /etc/sddm.conf, so a setting made on the machine still wins.
# The login screen runs on KWin (Wayland), as the Plasma session does: no X server is started.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

# Plasma's login screen theme. Debian points SDDM at a theme through /etc/alternatives, which an empty
# /etc does not have.
[Theme]
Current=breeze
