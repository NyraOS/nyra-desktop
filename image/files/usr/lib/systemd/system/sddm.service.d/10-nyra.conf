# nyra-desktop: SDDM starts after plymouth has quit (docs/IMAGE.md, "Boot screen"). While plymouth
# holds the display, KWin of the login screen cannot take it, and SDDM's start fails. With plymouth
# switched off on the command line, plymouth-quit still runs, at once, and costs nothing.
[Unit]
After=plymouth-quit.service
