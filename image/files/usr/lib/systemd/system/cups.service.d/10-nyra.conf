# cupsd with the desktop's configuration: the local socket only, no web interface, no browsing
# (Containerfile, docs/IMAGE.md "Printing"). cupsd takes the directory of the configuration file as its
# ServerRoot (printers, PPDs, cups-files.conf), which must stay /etc/cups: /usr is read-only. So the
# copy from /usr goes next to them, under another name, at every start.
[Service]
ExecStartPre=/usr/bin/install -D -m 644 /usr/lib/nyra/cups/cupsd.conf /etc/cups/nyra-cupsd.conf
ExecStart=
ExecStart=/usr/sbin/cupsd -l -c /etc/cups/nyra-cupsd.conf
