# nyra-desktop: the boot screen stays on screen when plymouth quits (docs/IMAGE.md, "Boot screen").
# --retain-splash leaves the last frame in the display until the next program draws, so there is no
# black flash between the boot screen and the login screen.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
