# Groups that the desktop's packages make in their scripts and no sysusers.d file of theirs makes
# (the build checks, docs/IMAGE.md "Checks"), so that systemd-sysusers makes them on a machine whose
# /etc is older than the image.
# ssl-cert: the group that may read private keys in /etc/ssl/private; cups-daemon depends on its package.
g ssl-cert -
