<!-- The session bus of the session test: Debian's session bus, listening on a socket in
     XDG_RUNTIME_DIR, which the test container shares (an abstract socket would need a shared network
     namespace too). -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <include>/usr/share/dbus-1/session.conf</include>
  <listen>unix:path=/run/user/1000/bus</listen>
</busconfig>
