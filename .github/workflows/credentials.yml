# Which jobs may hold a signing credential (docs/RELEASE.md, "Who can sign"): ci/check-credential-jobs.py
# on every workflow. Runs on every pull request and every push to main, with no path filter, so that it
# can be a required check (its name is `credential-jobs`). It uses nothing but the repository's own files:
# on a pull request the script comes from the pull request, so it catches mistakes; the control against a
# deliberate change is review of .github/ and ci/ (CODEOWNERS) and the branch ruleset.
name: credentials
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  credential-jobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The credential lint, its self-test first
        run: |
          python3 -I ci/check-credential-jobs.py --self-test
          python3 -I ci/check-credential-jobs.py
      - name: The image check of an image's identity, its self-test
        run: ci/check-image-repository.sh --self-test
