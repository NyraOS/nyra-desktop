# SPDX-License-Identifier: GPL-3.0-or-later
# Which jobs may hold a signing credential (docs/RELEASE.md, "Who can sign"): ci/check-credential-jobs.py
# on every workflow. Runs on every pull request and every push to main, with no path filter, so that it
# can be a required check (its name is `credential-jobs`). It also runs the pinned base's own lints of the
# sign and publish jobs (nyra-base's ci/check-sign-jobs.py and ci/check-publish-job.py, from the commit in
# base/pin), which apply to this repository's jobs of the same names unchanged. On a pull request the
# scripts come from the pull request and its pin, so they catch mistakes; the control against a deliberate
# change is review of .github/, ci/ and base/ (CODEOWNERS) and the branch ruleset.
name: credentials
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  credential-jobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The credential lint, its self-test first
        run: |
          python3 -I ci/check-credential-jobs.py --self-test
          python3 -I ci/check-credential-jobs.py
      - name: The self-tests of the image identity, signer policy and publish checks
        run: |
          ci/check-image-repository.sh --self-test
          ci/check-signer-policy.sh --self-test
          ci/check-publish.sh --self-test
      - name: The commit of the pinned base (base/pin)
        id: pin
        run: |
          commit="$(sed -n 's/^commit=//p' base/pin)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base/pin has no commit"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NyraOS/nyra-base
          ref: ${{ steps.pin.outputs.commit }}
          path: .nyra-base
          persist-credentials: false
      # Only the sign jobs in the environment `sign`; only the publish jobs in `publish`, with no id-token,
      # and the R2 and Cloudflare secrets nowhere else.
      - name: The pinned base's lints of the sign and publish jobs
        run: |
          python3 -I .nyra-base/ci/check-sign-jobs.py
          python3 -I .nyra-base/ci/check-publish-job.py .
