# SPDX-License-Identifier: GPL-3.0-or-later
# The desktop image (docs/IMAGE.md): built on the pinned nyra-base (base/pin) with its own sealed UKI,
# signed with keys made for the run only, then booted in a VM with Secure Boot to the login screen and
# a Plasma session (docs/TESTING.md, "Level 2"). Nothing is signed with a release key or published.
name: image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  WORK: /mnt/work
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      base_commit: ${{ steps.pin.outputs.commit }}
      uki_cert: ${{ steps.image.outputs.uki_cert }}
      image_sha256: ${{ steps.export.outputs.image_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The commit of the pinned base (base/pin)
        id: pin
        run: |
          commit="$(sed -n 's/^commit=//p' base/pin)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base/pin has no commit"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # nyra-base at that commit: its signature policy and verified pull, its UKI and signing scripts,
      # its SBOM scanner. ci/pull-base.sh checks that the pinned image was built from this commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NyraOS/nyra-base
          ref: ${{ steps.pin.outputs.commit }}
          path: .nyra-base
          persist-credentials: false

      # The runner image enables podman-auto-update.timer, which prunes untagged images (a build stage
      # among them) within 15 min of boot (nyra-base docs/LESSONS.md).
      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      - name: Install the signing tools
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update -q >/dev/null
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y -q --no-install-recommends sbsigntool python3-pefile >/dev/null
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"
          df -h / /mnt

      - name: Pull and verify the pinned base (ci/pull-base.sh)
        run: |
          id="$(ci/pull-base.sh .nyra-base)"
          echo "BASE_ID=$id" >> "$GITHUB_ENV"
          s="$(sed -n 's/^Snapshot=//p' .nyra-base/mkosi/mkosi.conf)"
          echo "SOURCE_DATE_EPOCH=$(date -u -d "${s:0:4}-${s:4:2}-${s:6:2}T${s:9:2}:${s:11:2}:${s:13:2}Z" +%s)" >> "$GITHUB_ENV"

      - name: Build the image with its sealed UKI (ci/build-image.sh)
        id: image
        run: |
          ci/build-image.sh .nyra-base "$BASE_ID" localhost/nyra-desktop:ci "$WORK/build" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.base.name="updates.nyraos.com/nyra-base:$(sed -n 's/^version=//p' base/pin)" \
            --label org.opencontainers.image.base.digest="$(sed -n 's/^digest=//p' base/pin)" 2>&1 | tee "$WORK/build.log"
          echo "uki_cert=$(base64 -w0 "$WORK/build/uki.crt")" >> "$GITHUB_OUTPUT"

      - name: No new setuid, setgid or capability files (ci/check-privileged.sh, image/privileged.txt)
        run: ci/check-privileged.sh localhost/nyra-desktop:ci "$BASE_ID"

      - name: Export the image
        id: export
        run: |
          mkdir -p dist
          sudo podman save --format oci-archive -o dist/nyra-desktop.oci.tar localhost/nyra-desktop:ci
          sudo chown "$(id -u):$(id -g)" dist/nyra-desktop.oci.tar
          echo "image_sha256=$(sha256sum < dist/nyra-desktop.oci.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          python3 -I .nyra-base/ci/no-host-keys.py dist/nyra-desktop.oci.tar
          {
            echo "## nyra-desktop (x86_64)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Base | nyra-base $(sed -n 's/^version=//p' base/pin), \`$(sed -n 's/^digest=//p' base/pin)\` |"
            echo "| Debian snapshot | \`$(sed -n 's/^Snapshot=//p' .nyra-base/mkosi/mkosi.conf)\` (unstable) |"
            echo "| Packages added | $(jq '.packages | length' "$WORK/build/desktop.manifest.json") ($(grep -vcE '^(#|$)' image/packages/desktop.list) listed in image/packages/, the rest their dependencies) |"
            echo "| Image | $(sudo podman image inspect -f '{{.Size}}' localhost/nyra-desktop:ci | numfmt --to=iec), $(du -h dist/nyra-desktop.oci.tar | cut -f1) oci-archive; the base $(sudo podman image inspect -f '{{.Size}}' "$BASE_ID" | numfmt --to=iec) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-desktop-oci-archive
          path: dist/nyra-desktop.oci.tar
          retention-days: 7

      # Last, after the upload: the scan fetches data from the network and runs a pinned PyPI package.
      - name: SBOM and vulnerability scan (ci/sbom.sh)
        run: |
          ci/sbom.sh .nyra-base localhost/nyra-desktop:ci "$WORK/build/desktop.manifest.json" dist/sbom
          cat dist/sbom/nyra-desktop.vulnerabilities.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyra-desktop-sbom
          path: dist/sbom/
          retention-days: 90

  boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NyraOS/nyra-base
          ref: ${{ needs.build.outputs.base_commit }}
          path: .nyra-base
          persist-credentials: false

      - name: Stop the runner's automatic image prune
        run: sudo systemctl stop podman-auto-update.timer podman-auto-update.service

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install QEMU and OVMF
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf \
            python3-virt-firmware systemd-ukify sbsigntool python3-pefile
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nyra-desktop-oci-archive
          path: ${{ env.WORK }}

      - name: Load the image
        env:
          IMAGE_SHA256: ${{ needs.build.outputs.image_sha256 }}
        run: |
          [ "$(sha256sum < "$WORK/nyra-desktop.oci.tar" | cut -d' ' -f1)" = "$IMAGE_SHA256" ] ||
            { echo "::error::the image artifact is not the one the build job made"; exit 1; }
          sudo podman load -q -i "$WORK/nyra-desktop.oci.tar"
          rm "$WORK/nyra-desktop.oci.tar"

      - name: Secure Boot to the login screen and a Plasma session (tests/vm/plasma.sh)
        env:
          UKI_CERT: ${{ needs.build.outputs.uki_cert }}
        run: |
          base64 -d <<<"$UKI_CERT" > "$RUNNER_TEMP/uki.crt"
          tests/vm/plasma.sh .nyra-base localhost/nyra-desktop:ci "$RUNNER_TEMP/uki.crt" "$WORK" "$RUNNER_TEMP/vm" \
            "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-boot
          path: ${{ runner.temp }}/vm/
          if-no-files-found: ignore
